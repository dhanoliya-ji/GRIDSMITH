# Render Blueprint — the gridsmith browser front end.
#
# Extraction is CPU-bound and runs per request, so the page cap keeps a single
# request inside the free plan's memory and time budget.
services:
  - type: web
    name: gridsmith
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GRIDSMITH_WEB_MAX_PAGES
        value: "8"
